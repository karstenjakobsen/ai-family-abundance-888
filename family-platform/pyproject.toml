[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "family-workspace"
version = "0.1.0"
description = "Self-hosted family agent terminal, durable memory, and host guardian"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
family-workspace = "family_workspace.cli:main"

[tool.setuptools.packages.find]
include = ["family_workspace*"]

[tool.setuptools.package-data]
family_workspace = ["*.md", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

